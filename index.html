
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آموزش تعاملی کسرها</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 24px;
      background: #f3f6fb;
      color: #24334a;
    }
    main {
      max-width: 520px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
    }
    .fraction {
      font-size: 48px;
      margin: 24px;
      color: #c62828;
    }
    .part {
      display: inline-block;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: conic-gradient(#e53935 0deg 120deg, #e0e5ed 120deg 360deg);
      margin: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>آموزش تعاملی کسرها</h1>
    <p>مدل نمونه برای نمایش کسر یک‌سوم</p>
    <div class="part" role="img" aria-label="یک‌سوم دایره رنگی"></div>
    <div class="fraction">۱/۳</div>
    <p>دایره به سه قسمت مساوی تقسیم شده و یک قسمت آن رنگی است.</p>
    <p>این صفحه نمونهٔ آموزشی است؛ هنوز مدل سه‌بعدی و واقعیت افزوده نیست.</p>
  </main>
</body>
</html>
